name: Deploy AvalTrust static site to S3 + CloudFront

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: avaltrust-prod-site-16e2397d
  CLOUDFRONT_DISTRIBUTION_ID: E1W7CUDMJQGLSZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync . s3://$S3_BUCKET/ \
            --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude ".idea/*" \
            --exclude "scss/*" --exclude "*.md" --exclude "CNAME"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
